[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
; The following flags are required to enable floating point support in printf
build_flags = 
	-Wl,-u,vfprintf
	-lprintf_flt
	-lm
	; A whole ERC2 Link packet must fit in the UART's receive buffer. The
	; stock 64 bytes does not; the library fails the build without this.
	-DSERIAL_RX_BUFFER_SIZE=256 -DSERIAL_TX_BUFFER_SIZE=256
	; Lets the library see src/erc2_config.h, where features are switched off.
	-I$PROJECT_SRC_DIR
; Matches link_baud in the firmware's spec/hardware.yaml.
monitor_speed = 500000
; Skip avrdude's read-back verify pass. The STK500v2 bootloader already
; ACKs and checksums every page, so this ~halves upload time.
upload_flags = -V
extra_scripts =
	pre:scripts/sync/bootstrap.py
	pre:scripts/erc2_config.py
	pre:scripts/library_update.py
	pre:scripts/esp32_update.py
	; Installs ERC2 Link, the VS Code panel, from the copy inside the library.
	pre:scripts/link_install.py
lib_deps =
    osu-eed/ERC2@*
	; Developers: point at a local checkout of the firmware monorepo instead.
	; Run `python tools/erc2 stage` there first, so bin/esp32 and bin/host
	; exist and the upload hook can find them.
	; symlink://../erc2-firmware/firmware/library/